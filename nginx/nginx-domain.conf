# nginx Configuration for city-pulse.app with API Subdomain
# This config handles both main domain and API subdomain routing

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Map to bypass rate limiting for OPTIONS (CORS preflight)
    # OPTIONS requests get empty key = no rate limiting
    # Other methods get normal IP-based rate limiting
    map $request_method $limit_key {
        OPTIONS "";
        default $binary_remote_addr;
    }

    # Rate limiting using conditional key
    # OPTIONS requests bypass rate limiting (empty key)
    limit_req_zone $limit_key zone=api:10m rate=10r/s;
    limit_req_zone $limit_key zone=login:10m rate=5r/m;

    # Hide server information
    server_tokens off;
    
    # NOTE: Security headers (X-Frame-Options, CSP, CORS, etc.) are handled by backend
    # via Helmet middleware to avoid duplication and conflicts

    # Upstream backend servers
    upstream backend {
        server backend:5000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80;
        keepalive 32;
    }

    # HTTP to HTTPS redirect for main domain
    server {
        listen 80;
        server_name city-pulse.app www.city-pulse.app;
        
        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://city-pulse.app$request_uri;
        }
    }

    # HTTP to HTTPS redirect for API subdomain
    server {
        listen 80;
        server_name api.city-pulse.app;
        
        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://api.city-pulse.app$request_uri;
        }
    }

    # Main website HTTPS server
    server {
        listen 443 ssl http2;
        server_name city-pulse.app;

        # SSL Configuration for main domain
        ssl_certificate /etc/letsencrypt/live/city-pulse.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/city-pulse.app/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:MozTLS:10m;
        ssl_session_tickets off;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Frontend static files and SPA routing
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                proxy_pass http://frontend;
                proxy_set_header Host $host;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Security.txt
        location = /.well-known/security.txt {
            return 200 "Contact: admin@city-pulse.app\nExpires: 2025-12-31T23:59:59.000Z\n";
            add_header Content-Type text/plain;
        }

        # Block sensitive files
        location ~ /\. {
            deny all;
        }
    }

    # WWW redirect to main domain
    server {
        listen 443 ssl http2;
        server_name www.city-pulse.app;

        # SSL Configuration for www
        ssl_certificate /etc/letsencrypt/live/city-pulse.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/city-pulse.app/privkey.pem;

        # Redirect to main domain
        return 301 https://city-pulse.app$request_uri;
    }

    # API subdomain HTTPS server
    # Architecture: Nginx handles SSL/routing/rate-limiting, Backend handles CORS/security headers
    server {
        listen 443 ssl http2;
        server_name api.city-pulse.app;

        # SSL Configuration for API subdomain
        ssl_certificate /etc/letsencrypt/live/api.city-pulse.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.city-pulse.app/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:MozTLS:10m;
        ssl_session_tickets off;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS (only SSL-related header at infrastructure level)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Proxy all requests to backend - backend handles CORS, security headers, OPTIONS
        location / {
            # Rate limiting for API
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header Connection "";
            
            # Disable buffering for WebSocket and real-time responses
            proxy_buffering off;
        }

        # Special rate limiting for auth endpoints
        # NOTE: OPTIONS (CORS preflight) automatically bypass via map $limit_key
        location ~ ^/(api/)?(auth|login|register) {
            limit_req zone=login burst=5 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        # File uploads endpoint with larger body size
        location ~ ^/(api/)?uploads {
            client_max_body_size 10M;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        # Health check endpoint
        location ~ ^/(api/)?health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            access_log off;
        }
    }
}