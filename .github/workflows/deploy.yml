name: 🚀 Auto Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile.prod
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: nginx/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nginx:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📁 Create deployment files
        run: |
          cat > docker-compose.server.yml << 'COMPOSE_EOF'
          services:
            postgres:
              image: postgres:15-alpine
              container_name: citypulse-postgres-prod
              restart: unless-stopped
              environment:
                POSTGRES_DB: \${POSTGRES_DB}
                POSTGRES_USER: \${POSTGRES_USER}
                POSTGRES_PASSWORD: \${POSTGRES_PASSWORD}
              volumes:
                - postgres_data:/var/lib/postgresql/data
                - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
              networks:
                - citypulse-network
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U \${POSTGRES_USER} -d \${POSTGRES_DB}"]
                interval: 10s
                timeout: 5s
                retries: 5
                start_period: 30s

            backend:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
              container_name: citypulse-backend-prod
              restart: unless-stopped
              environment:
                NODE_ENV: production
                PORT: 5000
                DB_HOST: postgres
                DB_PORT: 5432
                DB_NAME: \${POSTGRES_DB}
                DB_USER: \${POSTGRES_USER}
                DB_PASSWORD: \${POSTGRES_PASSWORD}
                JWT_SECRET: \${JWT_SECRET}
                JWT_REFRESH_SECRET: \${JWT_REFRESH_SECRET}
                GOOGLE_CLIENT_ID: \${GOOGLE_CLIENT_ID}
                GOOGLE_CLIENT_SECRET: \${GOOGLE_CLIENT_SECRET}
                EMAIL_HOST: \${EMAIL_HOST}
                EMAIL_PORT: \${EMAIL_PORT}
                EMAIL_USER: \${EMAIL_USER}
                EMAIL_PASS: \${EMAIL_PASS}
                FRONTEND_URL: \${FRONTEND_URL}
                DATABASE_URL: postgres://\${POSTGRES_USER}:\${POSTGRES_PASSWORD}@postgres:5432/\${POSTGRES_DB}
              volumes:
                - uploads_data:/app/backend/uploads
              networks:
                - citypulse-network
              depends_on:
                postgres:
                  condition: service_healthy
              healthcheck:
                test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 40s

            frontend:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
              container_name: citypulse-frontend-prod
              restart: unless-stopped
              environment:
                VITE_API_URL: \${VITE_API_URL}
                VITE_GOOGLE_CLIENT_ID: \${VITE_GOOGLE_CLIENT_ID}
                VITE_GOOGLE_CLIENT_SECRET: \${VITE_GOOGLE_CLIENT_SECRET}
                VITE_GOOGLE_REDIRECT_URI: \${VITE_GOOGLE_REDIRECT_URI}
              networks:
                - citypulse-network
              depends_on:
                backend:
                  condition: service_healthy
              healthcheck:
                test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null 2>&1 || exit 1"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 20s

            nginx:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nginx:latest
              container_name: citypulse-nginx-prod
              restart: unless-stopped
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - nginx_logs:/var/log/nginx
                - /etc/letsencrypt/live/city-pulse.app:/etc/nginx/ssl:ro
              networks:
                - citypulse-network
              depends_on:
                frontend:
                  condition: service_healthy
                backend:
                  condition: service_healthy
              healthcheck:
                test: ["CMD", "nginx", "-t"]
                interval: 30s
                timeout: 3s
                retries: 3

          volumes:
            postgres_data:
              driver: local
            uploads_data:
              driver: local
            nginx_logs:
              driver: local

          networks:
            citypulse-network:
              driver: bridge
          COMPOSE_EOF

          cat > .env << 'ENV_EOF'
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          EMAIL_HOST=${{ secrets.EMAIL_HOST }}
          EMAIL_PORT=${{ secrets.EMAIL_PORT }}
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASS=${{ secrets.EMAIL_PASS }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET=${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          VITE_GOOGLE_REDIRECT_URI=${{ secrets.VITE_GOOGLE_REDIRECT_URI }}
          ENV_EOF

      - name: 📤 Upload deployment files
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.server.yml,.env,backend/sql/schema.sql"
          target: /opt/citypulse/
          strip_components: 0

      - name: 🚀 Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/citypulse
            
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "🛑 Stopping services..."
            docker compose -f docker-compose.server.yml down || true
            
            echo "📦 Pulling latest images..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-nginx:latest
            
            echo "🚀 Starting services..."
            docker compose -f docker-compose.server.yml up -d
            
            echo "⏳ Waiting for services..."
            sleep 45
            
            echo "🔍 Checking deployment..."
            if curl -sf https://api.city-pulse.app/api/health >/dev/null; then
              echo "✅ Deployment successful!"
              docker compose -f docker-compose.server.yml ps
            else
              echo "❌ Deployment failed!"
              docker compose -f docker-compose.server.yml logs --tail=50
              exit 1
            fi
            
            docker image prune -f

      - name: 📢 Notify Success
        if: success()
        run: echo "🎉 Auto-deployment successful! https://city-pulse.app is live"
