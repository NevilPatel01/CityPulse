name: 🚀 Deploy to Digital Ocean

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.10.0'

jobs:
  # Job 1: Code Quality and Testing
  test:
    name: 🧪 Test & Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📊 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 💾 Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: ⚡ Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Lint code
        run: |
          pnpm --filter frontend lint
          pnpm --filter backend lint

      - name: 🏗️ Build application
        run: |
          cd frontend && pnpm build
          cd ../backend && pnpm build

  # Job 2: Build and Push Docker Images
  build:
    name: � Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: 🔡 Prepare image names
        run: |
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=$REPO_LOWER" >> $GITHUB_ENV
          echo "BACKEND_IMAGE=ghcr.io/${REPO_LOWER}-backend:${GITHUB_SHA}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${REPO_LOWER}-frontend:${GITHUB_SHA}" >> $GITHUB_ENV

      - name: � Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: �🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: � Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.REPO_LOWER }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile.prod
          push: true
          tags: ${{ env.BACKEND_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: 🏗️ Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile.prod
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # Job 3: Deploy to Digital Ocean
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: 🔡 Prepare image names
        run: |
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=$REPO_LOWER" >> $GITHUB_ENV
          echo "BACKEND_IMAGE=ghcr.io/${REPO_LOWER}-backend:${GITHUB_SHA}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${REPO_LOWER}-frontend:${GITHUB_SHA}" >> $GITHUB_ENV

      - name: 📁 Create deployment package
        run: |
          mkdir -p deploy/backend
          cp docker-compose.prod.yml deploy/
          cp -r nginx deploy/
          cp -r backend/sql deploy/backend/

          # Create environment file with proper quoting
          cat > deploy/.env << 'ENV_EOF'
          # Database Configuration
          POSTGRES_DB="${{ secrets.POSTGRES_DB }}"
          POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
          POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"

          # JWT Configuration  
          JWT_SECRET="${{ secrets.JWT_SECRET }}"
          JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}"

          # Google OAuth (Backend)
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"

          # Google OAuth (Frontend)
          VITE_GOOGLE_CLIENT_ID="${{ secrets.VITE_GOOGLE_CLIENT_ID }}"
          VITE_GOOGLE_CLIENT_SECRET="${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}"
          VITE_GOOGLE_REDIRECT_URI="${{ secrets.VITE_GOOGLE_REDIRECT_URI }}"

          # Email Configuration
          EMAIL_HOST="${{ secrets.EMAIL_HOST }}"
          EMAIL_PORT="${{ secrets.EMAIL_PORT }}"
          EMAIL_USER="${{ secrets.EMAIL_USER }}"
          EMAIL_PASS="${{ secrets.EMAIL_PASS }}"

          # URLs
          FRONTEND_URL="${{ secrets.FRONTEND_URL }}"
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          VITE_API_URL="${{ secrets.BACKEND_URL }}"

          # Docker Images
          BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}"
          FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}"
          ENV_EOF

      - name: 📦 Create deployment archive
        run: tar -czf deploy.tar.gz -C deploy .

      - name: 🚀 Prepare deployment directory
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DO_SSH_PORT }}
          script: |
            # Create deployment directory with root ownership
            mkdir -p /opt/citypulse
            chown -R root:root /opt/citypulse
            chmod 755 /opt/citypulse
            
            # Switch to deployment directory
            cd /opt/citypulse

            # Backup current deployment
            if [ -f docker-compose.prod.yml ]; then
                echo "📦 Creating backup..."
                docker compose -f docker-compose.prod.yml down --remove-orphans || true
                tar -czf "backup-$(date +%Y%m%d-%H%M%S).tar.gz" . --exclude='backup-*.tar.gz' || true
            fi

            # Keep only the latest backup, remove all others
            echo "🧹 Cleaning old backups..."
            cd /opt/citypulse
            ls -t backup-*.tar.gz 2>/dev/null | tail -n +2 | xargs -r rm -f
            echo "✅ Old backups removed, keeping only the latest"

            # Clean up old files
            rm -rf backend nginx
            rm -f .env docker-compose.prod.yml
            
            echo "✅ Deployment directory ready: /opt/citypulse"

      - name: 📤 Upload deployment package
        uses: appleboy/scp-action@v0.1.7
        with:
            host: ${{ secrets.DO_HOST }}
            username: root
            key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
            port: ${{ secrets.DO_SSH_PORT }}
            source: deploy.tar.gz
            target: /opt/citypulse
            strip_components: 0
            overwrite: true

      - name: 🔐 Login to registry and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DO_SSH_PORT }}
          timeout: 60s
          command_timeout: 10m
          script: |
            cd /opt/citypulse

            # Extract deployment package
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            # Login to GitHub Container Registry using the registry token
            echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Stop existing containers
            docker compose -f docker-compose.prod.yml down || true

            # Export environment variables for compose and pulls
            set -a
            source .env
            set +a

            # Pull latest images using environment variables from .env
            docker pull "${BACKEND_IMAGE}"
            docker pull "${FRONTEND_IMAGE}"

            # Start services
            docker compose --env-file .env -f docker-compose.prod.yml up -d

            # Wait for services to be healthy
            echo "⏳ Waiting for services to be healthy..."
            timeout 300 bash -c 'until docker compose -f docker-compose.prod.yml ps | grep -q "healthy"; do sleep 5; done'

            # Verify deployment
            if docker compose -f docker-compose.prod.yml ps | grep -q "unhealthy\|Restarting"; then
                echo "❌ Deployment failed - some services are unhealthy"
                docker compose -f docker-compose.prod.yml logs
                exit 1
            else
                echo "✅ Deployment successful!"
                docker compose -f docker-compose.prod.yml ps
            fi

            # Cleanup old Docker images (keep only current)
            echo "🧹 Removing old Docker images..."
            docker image prune -a -f
            echo "✅ Docker cleanup complete"

  # Job 4: Notification
  notify:
    name: 📢 Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: 📢 Deployment Success
        if: needs.deploy.result == 'success'
        run: |
            echo "🎉 Deployment successful!"
            echo "✅ Application is live at: https://city-pulse.app"

      - name: 🚨 Deployment Failed
        if: needs.deploy.result == 'failure'
        run: |
            echo "❌ Deployment failed!"
            echo "Please check the logs and try again."
            exit 1
