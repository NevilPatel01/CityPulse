name: 🚀 Auto Deploy to Production

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: 🔡 Prepare lowercase image names
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "BACKEND_IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-backend:${GITHUB_SHA}" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-frontend:${GITHUB_SHA}" >> $GITHUB_ENV

      - name: 🔐 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile.prod
          push: true
          tags: ${{ env.BACKEND_IMAGE }},ghcr.io/${{ env.REPO_LOWER }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🏗️ Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile.prod
          push: true
          tags: ${{ env.FRONTEND_IMAGE }},ghcr.io/${{ env.REPO_LOWER }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📁 Prepare deployment bundle
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy/backend deploy/nginx

          cp docker-compose.prod.yml deploy/docker-compose.prod.yml
          cp -r nginx/. deploy/nginx/
          cp -r backend/sql deploy/backend/

          cat > deploy/.env <<'ENV_EOF'
          POSTGRES_DB="${{ secrets.POSTGRES_DB }}"
          POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
          POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
          JWT_SECRET="${{ secrets.JWT_SECRET }}"
          JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          EMAIL_HOST="${{ secrets.EMAIL_HOST }}"
          EMAIL_PORT="${{ secrets.EMAIL_PORT }}"
          EMAIL_USER="${{ secrets.EMAIL_USER }}"
          EMAIL_PASS="${{ secrets.EMAIL_PASS }}"
          FRONTEND_URL="${{ secrets.FRONTEND_URL }}"
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}"
          FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}"
          ENV_EOF

      - name: 📦 Create deployment archive
        run: tar -czf deploy.tar.gz -C deploy .

      - name: � Deploy to Digital Ocean
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DO_SSH_PORT || 22 }}
          script: |
            # Create deployment directory with root ownership
            mkdir -p /opt/citypulse
            chown -R root:root /opt/citypulse
            
            # Switch to deployment directory
            cd /opt/citypulse

            # Backup current deployment
            if [ -f docker-compose.prod.yml ]; then
                echo "📦 Creating backup..."
                docker compose -f docker-compose.prod.yml down --remove-orphans || true
                tar -czf "backup-$(date +%Y%m%d-%H%M%S).tar.gz" . --exclude='backup-*.tar.gz' || true
            fi

            # Clean up old files
            rm -rf backend nginx
            rm -f .env docker-compose.prod.yml

      - name: 📤 Upload deployment package
        uses: appleboy/scp-action@v0.1.5
        with:
            host: ${{ secrets.DO_HOST }}
            username: root
            key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
            port: ${{ secrets.DO_SSH_PORT || 22 }}
            source: deploy.tar.gz
            target: /opt/citypulse/

      - name: 🔐 Login to registry and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DO_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          script: |
            cd /opt/citypulse

            # Extract deployment package
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            # Login to GitHub Container Registry using the GITHUB_TOKEN
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Stop existing containers
            docker compose -f docker-compose.prod.yml down || true

            # Export environment variables for compose and pulls
            set -a
            source .env
            set +a

            # Pull latest images using environment variables from .env
            docker pull "${BACKEND_IMAGE}"
            docker pull "${FRONTEND_IMAGE}"

            # Start services
            docker compose --env-file .env -f docker-compose.prod.yml up -d

            # Wait for services to be healthy
            echo "⏳ Waiting for services to be healthy..."
            timeout 300 bash -c 'until docker compose -f docker-compose.prod.yml ps | grep -q "healthy"; do sleep 5; done'

            # Verify deployment
            if docker compose -f docker-compose.prod.yml ps | grep -q "unhealthy\|Restarting"; then
                echo "❌ Deployment failed - some services are unhealthy"
                docker compose -f docker-compose.prod.yml logs
                exit 1
            else
                echo "✅ Deployment successful!"
                docker compose -f docker-compose.prod.yml ps
            fi

            # Cleanup old images
            docker image prune -f

      - name: 📢 Notify Success
        if: success()
        run: echo "🎉 Auto-deployment successful! https://city-pulse.app is live"
