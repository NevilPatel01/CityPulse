services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: citypulse-postgres-dev
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: citypulse_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - citypulse-network

  # Backend Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: citypulse-backend-dev
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://user:password@postgres:5432/citypulse_dev
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/workspace/backend
      - ./shared:/workspace/shared
      - backend_node_modules:/workspace/node_modules
    depends_on:
      - postgres
    networks:
      - citypulse-network
    command: pnpm run dev

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: citypulse-frontend-dev
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:5001/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/workspace/frontend/src
      - ./frontend/index.html:/workspace/frontend/index.html
      - ./shared/src:/workspace/shared/src
      - frontend_node_modules:/workspace/node_modules
    networks:
      - citypulse-network
    command: pnpm run dev

volumes:
  postgres_data_dev:
  backend_node_modules:
  frontend_node_modules:

networks:
  citypulse-network:
    driver: bridge
