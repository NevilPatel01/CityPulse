services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: citypulse-postgres-dev
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: citypulse_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - citypulse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d citypulse_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Backend Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: citypulse-backend-dev
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://user:password@postgres:5432/citypulse_dev
      JWT_SECRET: dev-jwt-secret-key-will-change-in-production
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3001
    ports:
      - "5001:5000"
    volumes:
      - citypulse_backend_src:/workspace/backend/src
      - citypulse_shared_src:/workspace/shared/src
      - backend_node_modules:/workspace/node_modules
      - backend_local_node_modules:/workspace/backend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - citypulse-network
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: citypulse-frontend-dev
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:5001
    ports:
      - "3001:3000"
    volumes:
      - citypulse_frontend_src:/workspace/frontend/src
      - citypulse_frontend_public:/workspace/frontend/public
      - citypulse_shared_src:/workspace/shared/src
      - frontend_node_modules:/workspace/node_modules
      - frontend_local_node_modules:/workspace/frontend/node_modules
    depends_on:
      - backend
    networks:
      - citypulse-network
    restart: unless-stopped

volumes:
  postgres_data_dev:
  backend_node_modules:
  backend_local_node_modules:
  frontend_node_modules:
  frontend_local_node_modules:
  citypulse_backend_src:
  citypulse_frontend_src:
  citypulse_frontend_public:
  citypulse_shared_src:

networks:
  citypulse-network:
    driver: bridge
