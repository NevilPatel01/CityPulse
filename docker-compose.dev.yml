services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: citypulse-postgres-dev
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: citypulse_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/sql/init-database.sh:/docker-entrypoint-initdb.d/02-init-database.sh
    networks:
      - citypulse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d citypulse_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # pgAdmin for Database GUI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: citypulse-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@citypulse.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - citypulse-network
    volumes:
      - pgadmin_data_dev:/var/lib/pgadmin

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: citypulse-backend-dev
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://user:password@postgres:5432/citypulse_dev
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN}
      FRONTEND_URL: ${FRONTEND_URL}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_SECURE: ${EMAIL_SECURE}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - citypulse-network
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
      - ./shared:/app/shared
      - /app/shared/node_modules
      - ./backend/uploads:/app/backend/uploads
    stdin_open: true
    tty: true
    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: citypulse-frontend-dev
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:5001
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      VITE_GOOGLE_CLIENT_SECRET: ${VITE_GOOGLE_CLIENT_SECRET}
      VITE_GOOGLE_REDIRECT_URI: ${VITE_GOOGLE_REDIRECT_URI}
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - citypulse-network
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - ./shared:/app/shared
      - /app/shared/node_modules
    stdin_open: true
    tty: true
    restart: unless-stopped


volumes:
  postgres_data_dev:
  pgadmin_data_dev:

networks:
  citypulse-network:
    driver: bridge
